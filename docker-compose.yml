services:
  api:
    build:
      context: .
    image: chemlab-api:dev
    ports:
      - "${API_PORT:-8030}:8030"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
    command:
      ["uvicorn", "chemlab_api.main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
