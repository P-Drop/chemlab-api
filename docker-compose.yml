services:
  api:
    build:
      context: .
    image: chemlab-api:dev
    ports:
      - "${API_PORT:-8030}:8030"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command:
      ["uvicorn", "chemlab_api.main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chemlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chemlab}
      POSTGRES_DB: ${POSTGRES_DB:-chemlab}
    ports:
      - "127.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chemlab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chemlab} -d ${POSTGRES_DB:-chemlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  chemlab-db-data:
